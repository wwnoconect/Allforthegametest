<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: Всё ради игры — Нора Сакавич</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at center, #1a0000 0%, #000000 70%);
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .screen {
    width: 100%;
    max-width: 680px;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    text-align: center;
    color: #ff3b3b;
    text-shadow: 0 0 20px rgba(255, 59, 59, 0.5);
    margin-bottom: 18px;
    line-height: 1.3;
  }

  .subtitle {
    text-align: center;
    color: #bbb;
    font-size: clamp(0.95rem, 2.5vw, 1.1rem);
    margin-bottom: 40px;
    line-height: 1.5;
  }

  .btn-main {
    display: block;
    width: 100%;
    padding: 18px;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    background: transparent;
    border: 2px solid #b30000;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-transform: uppercase;
  }

  .btn-main:hover {
    background: #b30000;
    box-shadow: 0 0 25px rgba(179, 0, 0, 0.7);
    transform: translateY(-2px);
  }

  /* Прогресс */
  .progress-wrap {
    margin-bottom: 30px;
  }

  .progress-text {
    text-align: center;
    color: #ff3b3b;
    font-weight: 600;
    margin-bottom: 10px;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: #222;
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #b30000, #ff3b3b);
    width: 0%;
    transition: width 0.4s ease;
    box-shadow: 0 0 10px rgba(255, 59, 59, 0.6);
  }

  /* Вопрос */
  .question {
    font-size: clamp(1.15rem, 3vw, 1.5rem);
    font-weight: 700;
    margin-bottom: 30px;
    line-height: 1.45;
    text-align: center;
    color: #fff;
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .answer-btn {
    width: 100%;
    padding: 16px 20px;
    font-size: 1rem;
    text-align: left;
    color: #f0f0f0;
    background: #111;
    border: 2px solid #333;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    line-height: 1.4;
  }

  .answer-btn:hover:not(:disabled) {
    border-color: #ff3b3b;
    background: #1a0000;
  }

  .answer-btn:disabled {
    cursor: default;
  }

  .answer-btn.correct {
    border-color: #2ecc71;
    background: rgba(46, 204, 113, 0.15);
    color: #2ecc71;
  }

  .answer-btn.wrong {
    border-color: #e74c3c;
    background: rgba(231, 76, 60, 0.15);
    color: #e74c3c;
  }

  /* Финал */
  .score {
    font-size: clamp(3rem, 12vw, 5rem);
    font-weight: 900;
    text-align: center;
    color: #ff3b3b;
    text-shadow: 0 0 30px rgba(255, 59, 59, 0.7);
    margin: 20px 0;
  }

  .result-text {
    text-align: center;
    font-size: clamp(1.05rem, 3vw, 1.3rem);
    line-height: 1.55;
    color: #ddd;
    margin-bottom: 40px;
    padding: 0 10px;
  }

  .result-text strong {
    color: #ff3b3b;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>

<!-- Главная -->
<div class="screen" id="startScreen">
  <h1>Тест на знание книги<br>«Всё ради игры»</h1>
  <p class="subtitle">Нора Сакавич · 10 вопросов<br>Проверь, насколько хорошо ты знаешь «Лисов»</p>
  <button class="btn-main" onclick="startQuiz()">Начать</button>
</div>

<!-- Вопросы -->
<div class="screen hidden" id="quizScreen">
  <div class="progress-wrap"><div class="progress-text" id="progressText">Вопрос 1 из 10</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="question" id="questionText"></div>
  <div class="answers" id="answersBox"></div>
</div>

<!-- Финал -->
<div class="screen hidden" id="finalScreen">
  <h1>Результат</h1>
  <div class="score" id="scoreText">0 / 10</div>
  <p class="result-text" id="resultText"></p>
  <button class="btn-main" onclick="restartQuiz()">Пройти заново</button>
</div>

<script>
  const questions = [
    {
      q: "Кем на самом деле является Нил Джостен?",
      a: [
        "Обычным парнем, который просто очень любит экси",
        "Сыном печально известного мафиози по прозвищу «Мясник»",
        "Тайным агентом, внедрённым в команду «Лисов»"
      ],
      correct: 1
    },
    {
      q: "Какое реальное имя носил Нил до того, как начал скрываться?",
      a: [
        "Натаниэль Веснински",
        "Рико Морияма",
        "Эндрю Миньярд"
      ],
      correct: 0
    },
    {
      q: "Какую ключевую роль играет Эндрю Миньярд в команде «Лисов»?",
      a: [
        "Он капитан команды и главный стратег",
        "Он вратарь и агрессивный защитник, который никого не подпускает к своим",
        "Он тренер, который собрал команду"
      ],
      correct: 1
    },
    {
      q: "Кто является главным антагонистом и «Королём» для Нила на протяжении большей части трилогии?",
      a: [
        "Кевин Дэй",
        "Рико Морияма",
        "Тренер Уаймак"
      ],
      correct: 1
    },
    {
      q: "Какая трагедия происходит с одним из «Лисов» в начале второй книги, что сильно влияет на команду?",
      a: [
        "Смерть Сета Гордона",
        "Арест Ники Хэммика",
        "Исчезновение Эндрю"
      ],
      correct: 0
    },
    {
      q: "Кем приходится Аарон Миньярд Эндрю Миньярду?",
      a: [
        "Его кузеном",
        "Его сводным братом",
        "Его братом-близнецом"
      ],
      correct: 2
    },
    {
      q: "Какую позицию на поле занимает Кевин Дэй, «Король экси»?",
      a: [
        "Вратарь",
        "Нападающий (страйкер)",
        "Защитник"
      ],
      correct: 1
    },
    {
      q: "Кто из «Лисов» является открытым геем и кузеном Эндрю и Аарона?",
      a: [
        "Мэтт Бойд",
        "Ники Хэммик",
        "Сет Гордон"
      ],
      correct: 1
    },
    {
      q: "Что служит главным мотивом для Нила, несмотря на постоянную угрозу его жизни?",
      a: [
        "Желание отомстить Рико",
        "Любовь к игре в экси и желание играть в команде",
        "Стремление получить образование в университете Пальметто"
      ],
      correct: 1
    },
    {
      q: "Кто из девушек в команде «Лисов» известна своим агрессивным стилем вождения и розовыми волосами?",
      a: [
        "Даниэль Уайлдс",
        "Рене Уокер",
        "Элисон Рейнольдс"
      ],
      correct: 2
    }
  ];

  const letters = ["A", "B", "C"];
  let current = 0;
  let correctCount = 0;

  const startScreen = document.getElementById("startScreen");
  const quizScreen = document.getElementById("quizScreen");
  const finalScreen = document.getElementById("finalScreen");
  const questionText = document.getElementById("questionText");
  const answersBox = document.getElementById("answersBox");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");
  const scoreText = document.getElementById("scoreText");
  const resultText = document.getElementById("resultText");

  function startQuiz() {
    current = 0;
    correctCount = 0;
    startScreen.classList.add("hidden");
    finalScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
    showQuestion();
  }

  function showQuestion() {
    const q = questions[current];
    progressText.textContent = `Вопрос ${current + 1} из ${questions.length}`;
    progressFill.style.width = `${(current / questions.length) * 100}%`;questionText.textContent = q.q;
    answersBox.innerHTML = "";

    q.a.forEach((text, i) => {
      const btn = document.createElement("button");
      btn.className = "answer-btn";
      btn.textContent = `${letters[i]}) ${text}`;
      btn.onclick = () => selectAnswer(i, btn);
      answersBox.appendChild(btn);
    });
  }

  function selectAnswer(index, btn) {
    const q = questions[current];
    const allBtns = answersBox.querySelectorAll(".answer-btn");
    allBtns.forEach(b => b.disabled = true);

    if (index === q.correct) {
      btn.classList.add("correct");
      correctCount++;
    } else {
      btn.classList.add("wrong");
      allBtns[q.correct].classList.add("correct");
    }

    setTimeout(() => {
      current++;
      if (current < questions.length) {
        showQuestion();
      } else {
        showFinal();
      }
    }, 900);
  }

  function showFinal() {
    progressFill.style.width = "100%";
    quizScreen.classList.add("hidden");
    finalScreen.classList.remove("hidden");

    // Анимация счётчика
    let displayed = 0;
    const target = correctCount;
    const step = target === 0 ? 1 : Math.ceil(target / 20);
    const timer = setInterval(() => {
      displayed += step;
      if (displayed >= target) {
        displayed = target;
        clearInterval(timer);
      }
      scoreText.textContent = `${displayed} / 10`;
    }, 40);
    scoreText.textContent = `0 / 10`;

    let msg = "";
    if (correctCount <= 3) {
      msg = "Ты совсем не знаешь «Лисов»… Пора перечитать трилогию!";
    } else if (correctCount <= 6) {
      msg = "Чуть-чуть забыл. Ты на верном пути, но детали стоит освежить.";
    } else if (correctCount <= 8) {
      msg = "Ты хорошо запомнил главных героев! Уважение.";
    } else {
      msg = "Ты знаешь всех героев и шаришь за ФД (Foxhole Court)! Настоящий фанат «Лисов».";
    }
    resultText.innerHTML = `<strong>${msg}</strong>`;
  }

  function restartQuiz() {
    finalScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
  }
</script>

</body>
</html>
